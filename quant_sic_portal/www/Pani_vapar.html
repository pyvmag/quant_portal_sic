<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>पाणी वापर संस्था</title>
    <link rel="shortcut icon" href="/img/logo/maharashtra.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Template CSS -->
    <link rel="stylesheet" href="/css/owl.carousel.css">
    <link rel="stylesheet" href="/css/fontawesome-all.css">
    <link rel="stylesheet" href="/css/simple-line-icons.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/flaticon.css">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/video.min.css">
    <link rel="stylesheet" href="/css/lightbox.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/header2.css">

    <link rel="stylesheet" href="/css/pani-vapar.css?v=202505091300">
</head>

<body class="page-pani-vapar">
    <div id="preloader"></div>
    <div class="up">
        <a href="#" class="scrollup text-center"><i class="fas fa-chevron-up"></i></a>
    </div>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <div class="main-content">
        <section id="breadcrumb" class="breadcrumb-section position-relative">
            <div class="background_overlay"></div>
            <div class="container">
                <div class="breadcrumb-content headline">
                    <h2 class="breadcrumb-title">पाणी वापर संस्था</h2>
                    <div class="breadcrumb_item ul-li">
                        <ul class="breadcrumb">
                            <li class="breadcrumb-item"><a href="#">मुख्य पान</a></li>
                            <li class="breadcrumb-item active">निविदा माहिती</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- Centered Content -->
        <div class="content-wrapper py-5">
            <button id="refresh-btn">Refresh Data</button>
            <div id="last-updated" class="last-updated"></div>

            <!-- Report Header Card -->
            <div id="title-container" class="report-header" style="display: none;"></div>

            <div id="loading" class="loading">डेटा लोड होत आहे... (Loading Data...)</div>
            <div id="error" class="error" style="display: none;"></div>

            <!-- Table Container Card -->
            <div id="table-container" style="display: none;"></div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Template JS -->
    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/jarallax.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/appear.js"></script>
    <script src="/js/isotope.pkgd.min.js"></script>
    <script src="/js/masonry.pkgd.min.js"></script>
    <script src="/js/imagesloaded.pkgd.min.js"></script>
    <script src="/js/lightbox.js"></script>
    <script src="/js/waypoints.min.js"></script>
    <script src="/js/jquery.counterup.min.js"></script>
    <script src="/js/tilt.jquery.min.js"></script>
    <script src="/js/wow.min.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/gmap3.min.js"></script>
    <script async src="http://maps.google.com/maps/api/js?key=AIzaSyC61_QVqt9LAhwFdlQmsNwi5aUJy9B2SyA"></script>

    <!-- JavaScript inside HTML -->
    <script>
        // Load Header & Footer
        async function loadHeader() {
            try {
                const res = await fetch('header2.html');
                const data = await res.text();
                document.getElementById('header-placeholder').innerHTML = data;
                setTimeout(() => {
                    const header = document.getElementById('header-placeholder');
                    if (header && window.getComputedStyle(header).position === 'fixed') {
                        const headerHeight = header.offsetHeight || 80;
                        document.body.style.paddingTop = headerHeight + 'px';
                    }
                }, 100);
                const hamburger = document.querySelector('.hamburger');
                const navMenu = document.getElementById('nav-menu');
                if (hamburger && navMenu) {
                    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
                    hamburger.addEventListener('click', () => {
                        hamburger.classList.toggle('open');
                        navMenu.classList.toggle('active');
                        document.body.classList.toggle('no-scroll');
                        if (navMenu.classList.contains('active')) {
                            document.body.style.paddingRight = scrollbarWidth + 'px';
                        } else {
                            document.body.style.paddingRight = '';
                        }
                    });
                    navMenu.querySelectorAll('a').forEach(link => {
                        link.addEventListener('click', () => {
                            if (window.innerWidth <= 992) {
                                navMenu.classList.remove('active');
                                hamburger.classList.remove('open');
                                document.body.classList.remove('no-scroll');
                                document.body.style.paddingRight = '';
                            }
                        });
                    });
                }
            } catch (err) {
                console.error("Header load error:", err);
            }
        }

        async function loadFooter() {
            try {
                const res = await fetch('footer.html');
                const data = await res.text();
                document.getElementById('footer-placeholder').innerHTML = data;
                setTimeout(() => {
                    const footer = document.getElementById('footer-placeholder');
                    if (footer && window.getComputedStyle(footer).position === 'fixed') {
                        const footerHeight = footer.offsetHeight || 100;
                        document.body.style.paddingBottom = footerHeight + 'px';
                    }
                }, 100);
            } catch (err) {
                console.error("Footer load error:", err);
            }
        }

        loadHeader();
        loadFooter();

        // Data Fetching
        const API_ENDPOINT = '/api/method/quant_sic_portal.api.get_general_sheet_data?sheet_name=SICF';

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const tableContainer = document.getElementById('table-container');
            const lastUpdatedEl = document.getElementById('last-updated');
            const titleContainer = document.getElementById('title-container');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            tableContainer.style.display = 'none';
            tableContainer.innerHTML = '';
            titleContainer.innerHTML = '';

            try {
                const response = await fetch(API_ENDPOINT);
                const result = await response.json();

                if (result.message && result.message.status === "ok") {
                    const data = result.message.message || result.message;

                    // Display Report Header (if any)
                    if (data.report_header && data.report_header.length > 0) {
                        data.report_header.forEach((row, idx) => {
                            const text = row.filter(c => c && c.trim()).join(' ');
                            if (text) {
                                const div = document.createElement('div');
                                if (idx === 0) div.className = 'title-heading';
                                else if (text.includes('परिशिष्ट')) div.className = 'annexure';
                                else div.className = 'subtitle-heading';
                                
                                div.textContent = text;
                                titleContainer.appendChild(div);
                            }
                        });
                        titleContainer.style.display = 'block';
                    }

                    if (data.date) {
                        lastUpdatedEl.textContent = `शेवटचे अपडेट: ${data.date}`;
                    }

                    if (data.tables && data.tables.length > 0) {
                        renderTables(data.tables, tableContainer, data.merges || []);
                    }

                    loadingEl.style.display = 'none';
                    tableContainer.style.display = 'block';
                } else {
                    throw new Error(result.message?.message || "Failed to load data");
                }
            } catch (err) {
                loadingEl.style.display = 'none';
                errorEl.innerHTML = `<strong>डेटा लोड करण्यात त्रुटी:</strong><br>${err.message}`;
                errorEl.style.display = 'block';
                console.error("Fetch error:", err);
            }
        }

        function renderTables(tables, container, merges = []) {
            if (!tables || tables.length === 0) return;

            // Wrap everything in a single table-container to have one scrollbar
            const mainWrapper = document.createElement('div');
            mainWrapper.className = 'table-container';
            container.appendChild(mainWrapper);

            tables.forEach(table => {
                const tableEl = document.createElement('table');
                tableEl.style.marginBottom = '0';
                if (mainWrapper.children.length > 0) {
                    tableEl.style.borderTop = 'none';
                }

                let tableHtml = '';
                if (table.title && !table.title.match(/^Table \d+$/)) {
                    tableHtml += `<caption>${table.title}</caption>`;
                }
                
                const startRow = table.start_row_index || 0;
                
                // Headers
                if (table.headers && table.headers.length > 0) {
                    tableHtml += `<thead>`;
                    table.headers.forEach((headerRow, rIdx) => {
                        tableHtml += `<tr>`;
                        headerRow.forEach((cell, cIdx) => {
                            const mergeInfo = checkMerge(startRow + rIdx, cIdx, merges);
                            if (mergeInfo.skip) return;
                            let attrs = `colspan="${mergeInfo.colspan}" rowspan="${mergeInfo.rowspan}"`;
                            tableHtml += `<th ${attrs}>${cell || ''}</th>`;
                        });
                        tableHtml += `</tr>`;
                    });
                    tableHtml += `</thead>`;
                }

                // Body
                tableHtml += `<tbody>`;
                const bodyRows = table.rows || [];
                const bodyStartRow = startRow + (table.headers ? table.headers.length : 0);
                
                bodyRows.forEach((row, rIdx) => {
                    const rowText = row.join(' ');
                    const isTotal = rowText.includes('एकूण') || rowText.includes('एकुण') || rowText.includes('Total') || rowText.includes('अखेर');
                    
                    tableHtml += `<tr class="${isTotal ? 'total-row' : ''}">`;
                    row.forEach((cell, cIdx) => {
                        const mergeInfo = checkMerge(bodyStartRow + rIdx, cIdx, merges);
                        if (mergeInfo.skip) return;
                        let attrs = `colspan="${mergeInfo.colspan}" rowspan="${mergeInfo.rowspan}"`;
                        const content = (cell !== undefined && cell !== null && String(cell).trim() !== '') ? cell : '&nbsp;';
                        tableHtml += `<td ${attrs}>${content}</td>`;
                    });
                    tableHtml += `</tr>`;
                });
                tableHtml += `</tbody>`;
                
                tableEl.innerHTML = tableHtml;
                mainWrapper.appendChild(tableEl);
            });

            initDragScroll(mainWrapper);
        }

        function checkMerge(row, col, merges) {
            if (!merges || merges.length === 0) return { skip: false, colspan: 1, rowspan: 1 };
            for (let m of merges) {
                if (m.startRowIndex === row && m.startColumnIndex === col) {
                    return { skip: false, colspan: m.endColumnIndex - m.startColumnIndex, rowspan: m.endRowIndex - m.startRowIndex };
                }
                if (row >= m.startRowIndex && row < m.endRowIndex && col >= m.startColumnIndex && col < m.endColumnIndex) {
                    return { skip: true };
                }
            }
            return { skip: false, colspan: 1, rowspan: 1 };
        }

        function initDragScroll(slider) {
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('active');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => {
                isDown = false;
            });

            slider.addEventListener('mouseup', () => {
                isDown = false;
            });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        document.addEventListener('DOMContentLoaded', fetchData);
        document.getElementById('refresh-btn').addEventListener('click', fetchData);
    </script>
    <script src="/js/visitor-count.js?v=1.2"></script>
</body>

</html>
